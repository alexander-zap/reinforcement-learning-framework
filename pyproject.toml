[project]
name = "reinforcement-learning-framework"
version = "0.11.1"
description = "An easy-to-read Reinforcement Learning (RL) framework. Provides standardized interfaces and implementations to various Reinforcement Learning methods and utilities."
authors = [{ name = "Alexander Zap" }]
requires-python = ">=3.9,<4"
readme = "README.md"
license = "MIT"
keywords = [
    "reinforcement learning",
    "rl",
    "imitation learning",
]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent"
]
dependencies = [
    "numpy>=1.26.3,<2",
    "protobuf>=3.20,<3.21",
    "gymnasium>=0.29,<0.30",
    "stable-baselines3[extra]>=2.2,<3",
    "sb3-contrib>=2.2,<3",
    "tqdm>=4.66,<5",
    "huggingface_hub>=0.19,<0.20",
    "imageio>=2.33.0,<3",
    "moviepy>=1.0.3,<2",
    "clearml>=1.14.1,<2",
    "dm-env-rpc>=1.1.6,<2",
    "pettingzoo>=1.24.3,<2",
    "imitation>=1.0.0,<2",
    "pyarrow-hotfix>=0.6,<0.7",
    "pyarrow<=20.0.0",
    "d3rlpy>=2.6,<3",
    "async-gym-agents>=0.4.1,<0.5",
    "supersuit>=3.9.3,<4",
    "onnx>=1.15.0,<2",
    "seaborn>=0.13,<0.14",
]

[project.urls]
Homepage = "https://github.com/alexander-zap/reinforcement-learning-framework"

[dependency-groups]
test = [
    "pytest>=7.2,<8",
    "pytest-cov>=4.0,<5",
]
dev = [
    "black>=23.11,<24",
    "pre-commit>=3.5,<4",
    "ruff>=0.8.3,<0.9",
]

[tool.uv]
default-groups = "all"

[tool.uv.build-backend]
module-name = "rl_framework"

[build-system]
requires = ["uv_build>=0.8.18,<0.9.0"]
build-backend = "uv_build"

[tool.ruff]
# Enable pycodestyle (`E`) and Pyflakes (`F`) codes by default.
select = ["E", "F"]
ignore = []

# Allow autofix for all enabled rules (when `--fix`) is provided.
fixable = ["A", "B", "C", "D", "E", "F", "G", "I", "N", "Q", "S", "T", "W", "ANN", "ARG", "BLE", "COM", "DJ", "DTZ", "EM", "ERA", "EXE", "FBT", "ICN", "INP", "ISC", "NPY", "PD", "PGH", "PIE", "PL", "PT", "PTH", "PYI", "RET", "RSE", "RUF", "SIM", "SLF", "TCH", "TID", "TRY", "UP", "YTT"]
unfixable = []

# Skip unused import rule.
extend-ignore = ["F401", "E712"]

# Exclude a variety of commonly ignored directories.
exclude = [
    ".bzr",
    ".direnv",
    ".eggs",
    ".git",
    ".hg",
    ".mypy_cache",
    ".nox",
    ".pants.d",
    ".pytype",
    ".ruff_cache",
    ".svn",
    ".tox",
    ".venv",
    "__pypackages__",
    "_build",
    "buck-out",
    "build",
    "dist",
    "node_modules",
    "venv",
]
per-file-ignores = { }

# Same as Black.
line-length = 120

# Allow unused variables when underscore-prefixed.
dummy-variable-rgx = "^(_+|(_+[a-zA-Z0-9_]*[a-zA-Z0-9]+?))$"

# Assume Python 3.9.
target-version = "py39"

[tool.ruff.mccabe]
# Unlike Flake8, default to a complexity level of 10.
max-complexity = 10

[tool.black]
line-length = 120
include = '\.pyi?$'
exclude = '''
/(
    \.git
  | \.hg
  | \.mypy_cache
  | \.tox
  | \.venv
  | _build
  | buck-out
  | build
  | dist
)/
'''

[tool.yamlfix]
line_length = 89
preserve_quotes = false
quote_basic_values = false
quote_representation = "'"
section_whitelines = 1
sequence_style = "block_style"
whitelines = 1
